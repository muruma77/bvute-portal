<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bvute Primary School</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand">
                <h1>Bvute Primary</h1>
                <p>Education 5.0</p>
            </div>

            <div id="alertMessage" class="alert"></div>

            <div class="role-selector" id="roleSelector">
                <div class="role-option active" data-role="admin">Admin</div>
                <div class="role-option" data-role="teacher">Teacher</div>
                <div class="role-option" data-role="parent">Parent</div>
                <div class="role-option" data-role="learner">Learner</div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailInput" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>

            <div class="text-center mt-20">
                <button class="btn-link" id="resetRequestBtn">Forgot Password?</button>
            </div>

            <div class="text-center mt-12" style="font-size:13px; color:#b0c0d0;">
                Bvute Primary School
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
